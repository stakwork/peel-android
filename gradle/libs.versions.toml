[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.06.01"
coreKtx = "1.18.0"
activityCompose = "1.12.4"
lifecycleRuntimeKtx = "2.10.0"
jna = "5.19.1"
junit = "4.13.2"
robolectric = "4.17"
androidxTestCore = "1.7.0"
hivemqMqttClient = "1.4.1"
coil = "3.0.4"
# Coil's own coil-network-okhttp already pulls this exact version in
# transitively; declared directly too for Calls' presence WebSocket
# (CallServer.kt) — java.net has no WebSocket client on this minSdk,
# and this is the one already on the classpath, not a second one.
okhttp = "4.12.0"
# The real in-app call (CallSession.kt) — peel's own iPhone/Mac apps are
# on client-sdk-swift 2.10.2; this is the Android SDK's own latest at
# the time this was added (2026-10-30), not a matched pair — the two
# SDKs version independently, same as any two platforms' native
# LiveKit clients talking to the same room.
livekit = "2.29.2"
# QR drawing (Receive) and reading (the invoice scanner): ZXing's own pure-Java
# core, not ML Kit, so nothing here needs Google Play Services (GrapheneOS
# first, docs/VISION.md). CameraX only feeds it frames.
zxing = "3.5.3"
camerax = "1.4.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
hivemq-mqtt-client = { group = "com.hivemq", name = "hivemq-mqtt-client", version.ref = "hivemqMqttClient" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
livekit-android = { group = "io.livekit", name = "livekit-android", version.ref = "livekit" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

[plugins]
# AGP 9+ compiles Kotlin itself; no org.jetbrains.kotlin.android plugin.
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
